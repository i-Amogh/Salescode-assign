name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - run: uv sync --frozen
      - run: uv run pytest tests/ -v
      - run: uv run pre-commit run --all-files
