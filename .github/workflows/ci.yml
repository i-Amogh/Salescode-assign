name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2

      - name: Purge uv cache on runner
        run: uv cache clean --verbose

      # ----------------------------------------------------------
      #  NEW: purge deleted members and regenerate lock on-the-fly
      # ----------------------------------------------------------
      - name: Strip deleted members from lock
        run: |
          find . -maxdepth 1 -type d -name 'livekit-plugins-*' -exec rm -rf {} \; 2>/dev/null || true
          find . -maxdepth 1 -type d -name 'livekit-blingfire' -exec rm -rf {} \; 2>/dev/null || true
          rm -f uv.lock
          uv lock

      # ----------------------------------------------------------
      #  existing steps (unchanged)
      # ----------------------------------------------------------
      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Lint & format checks
        run: |
          uv run pre-commit run --all-files